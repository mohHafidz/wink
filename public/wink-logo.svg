<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadow Filters -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="softGlow" x="-80%" y="-150%" width="260%" height="400%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 1. Squircle Glass Base Gradient -->
    <linearGradient id="squircleBase" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="50%" stop-color="#101117"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- 2. Hairline Specular Outer Rim -->
    <linearGradient id="rimSpecular" x1="128" y1="32" x2="384" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>

    <!-- 3. Dynamic Notch Pill Base -->
    <linearGradient id="notchBody" x1="100" y1="190" x2="412" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e212b"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>

    <!-- 4. Pill Inner Rim -->
    <linearGradient id="pillRim" x1="100" y1="198" x2="412" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>

    <!-- 5. Wink Arc Gradient (Ice White Titanium) -->
    <linearGradient id="winkArcGrad" x1="170" y1="260" x2="340" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.75"/>
    </linearGradient>

    <!-- 6. Aperture Gleam Glow Radial -->
    <radialGradient id="gleamRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- LAYER 1: Base Squircle (Apple / Windows 11 HIG Geometry) -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#squircleBase)" filter="url(#squircleShadow)"/>
  <rect x="36.5" y="36.5" width="439" height="439" rx="103.5" ry="103.5" stroke="url(#rimSpecular)" stroke-width="1.5" fill="none"/>

  <!-- LAYER 2: Subtle Horizon Bezel Guide Line (Top Anchor) -->
  <line x1="112" y1="140" x2="400" y2="140" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- LAYER 3: The Floating Notch Capsule -->
  <rect x="100" y="200" width="312" height="112" rx="56" ry="56" fill="url(#notchBody)" filter="url(#pillShadow)"/>
  <rect x="100.75" y="200.75" width="310.5" height="110.5" rx="55.25" ry="55.25" stroke="url(#pillRim)" stroke-width="1.5" fill="none"/>

  <!-- LAYER 4: Ambient Sensor Portal (Left Eye Dot) -->
  <circle cx="166" cy="256" r="13" fill="#08090d" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="166" cy="256" r="6" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="164" cy="254" r="2" fill="#ffffff" fill-opacity="0.9"/>

  <!-- LAYER 5: The Signature "Wink" Curved Iris Arc -->
  <path d="M 226 250 C 248 276, 296 276, 326 248" 
        stroke="url(#winkArcGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        filter="url(#softGlow)"/>

  <!-- LAYER 6: Specular Gleam / Aperture Sparkle -->
  <g id="specularGleam">
    <circle cx="350" cy="224" r="26" fill="url(#gleamRadial)"/>
    <path d="M 350 215 Q 350 224 359 224 Q 350 224 350 233 Q 350 224 341 224 Q 350 224 350 215 Z" fill="#ffffff"/>
    <circle cx="350" cy="224" r="2.2" fill="#ffffff"/>
  </g>
</svg>
